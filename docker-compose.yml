services:
  be-lootfast:
    build: .
    container_name: lootfast_be
    restart: always
    env_file:
      - .env
    environment:
      DB_HOST: postgres-db
      REDIS_HOST: redis
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    depends_on:
      - postgres-db
      - redis

  postgres-db:
    image: postgres:15-alpine
    container_name: lootfast_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: lootfast_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - postgres-db

  redis:
    image: redis:7-alpine
    container_name: lootfast_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - |
        if [ -n "$${REDIS_PASSWORD}" ]; then
          exec redis-server --requirepass "$${REDIS_PASSWORD}"
        else
          exec redis-server
        fi
    ports:
      - "${REDIS_PORT:-6379}:6379"

volumes:
  postgres_data:
