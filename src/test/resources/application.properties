# Each Spring context owns its schema; closing one must not drop another context's tables.
spring.datasource.url=jdbc:h2:mem:lootfast-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false
management.health.redis.enabled=false
lootfast.no-show-sweeper.enabled=false
lootfast.suspension-sweeper.enabled=false
lootfast.payment-dispute-sweeper.enabled=false

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=

EMAIL_PROVIDER=brevo
BREVO_API_KEY=test-brevo-api-key
BREVO_FROM_EMAIL=test@lootfast.local
BREVO_FROM_NAME=LootFast Test

APP_NAME=lootfast-backend
SERVER_PORT=8080
CONTEXT_PATH=
CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
security.jwt.secret=dGVzdC1qd3Qtc2VjcmV0LW11c3QtYmUtYXQtbGVhc3QtMzItYnl0ZXMtbG9uZw==
security.jwt.access-token-expiration=15m
security.refresh-token.expiration=30d
security.otp.hmac-secret=test-otp-hmac-secret-that-is-at-least-32-characters

lootfast.pickup-reminders.enabled=false

lootfast.email-outbox.enabled=false
lootfast.saved-filter-notifications.enabled=false

lootfast.vnpay.query.enabled=false

lootfast.realtime.relay=local
lootfast.notifications.matching.worker-enabled=false
