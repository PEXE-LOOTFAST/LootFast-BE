server:
  # PaaS providers inject PORT; SERVER_PORT remains convenient for local Docker.
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework
  servlet:
    context-path: ${CONTEXT_PATH:}

spring:
  application:
    name: ${APP_NAME:lootfast-backend}

  # Tự động đọc file .env ở thư mục gốc
  config:
    import: optional:file:.env[.properties]

  # 1. Cấu hình Database (PostgreSQL)
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSL_MODE:disable}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5

  # 2. Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  # Flyway quản lý schema production. Chỉ bật baseline-on-migrate khi
  # tiếp nhận database không rỗng đã tồn tại trước Flyway.
  flyway:
    enabled: true
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 0
    validate-on-migrate: true

  # Hibernate chỉ kiểm tra entity khớp schema, không tự ý sửa database.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

app:
  cors:
    # Production must override this with the exact deployed frontend origin(s).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

email:
  provider: ${EMAIL_PROVIDER:brevo}
  brevo:
    base-url: ${BREVO_BASE_URL:https://api.brevo.com/v3}
    api-key: ${BREVO_API_KEY}
    from-email: ${BREVO_FROM_EMAIL}
    from-name: ${BREVO_FROM_NAME:LootFast}
    connect-timeout: ${BREVO_CONNECT_TIMEOUT:3s}
    read-timeout: ${BREVO_READ_TIMEOUT:10s}

# 3. Cấu hình Swagger UI (Tài liệu API cho FE)
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: false
  default-produces-media-type: application/json

security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:15m}
  refresh-token:
    expiration: ${REFRESH_TOKEN_EXPIRATION:30d}
  otp:
    hmac-secret: ${OTP_HMAC_SECRET}
  social:
    google:
      issuer: https://accounts.google.com
      jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
      client-ids: ${GOOGLE_CLIENT_IDS:}
    apple:
      issuer: https://appleid.apple.com
      jwk-set-uri: https://appleid.apple.com/auth/keys
      client-ids: ${APPLE_CLIENT_IDS:}

storage:
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}

lootfast:
  vnpay:
    enabled: ${VNPAY_ENABLED:false}
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    payment-url: ${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:}
